[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiofinder"
version = "0.1.0"
description = "Find networked devices by emitting and listening for an audio chirp, with NTP-synchronized timestamps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "click>=8.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
audiofinder = "audiofinder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audiofinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
